[project]
name = "witness"
version = "0.1.0"
description = "A FastAPI service that watches a procedure video and proves what happened, when, and by whom."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Rahul Modugula" }]
keywords = [
    "fastapi",
    "computer-vision",
    "yolo-world",
    "mediapipe",
    "object-tracking",
    "sop-compliance",
    "video-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Video :: Analysis",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/RahulModugula/witness"
Repository = "https://github.com/RahulModugula/witness"
Issues = "https://github.com/RahulModugula/witness/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
